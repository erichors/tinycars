{{- if .Values.networkSimulator.enabled }}
{{- $devices := list "router-01" "switch-01" "ap-01" "firewall-01" "server-01" "pos-01" "pos-02" "handheld-01" "handheld-02" }}
apiVersion: v1
kind: Secret
metadata:
  name: tinycars-network-snmp
  labels:
    app.kubernetes.io/part-of: tinycars
type: Opaque
stringData:
  community: {{ .Values.networkSimulator.community | quote }}
{{- range $site := (.Values.networkSimulator.sites | default (list "boston" "chicago" "london")) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-simulator-{{ $site }}
  labels:
    app.kubernetes.io/name: network-simulator
    app.kubernetes.io/part-of: tinycars
    tinycars.io/site: {{ $site }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-simulator
      tinycars.io/site: {{ $site }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-simulator
        app.kubernetes.io/part-of: tinycars
        tinycars.io/site: {{ $site }}
      annotations:
        oneagent.dynatrace.com/inject: "false"
    spec:
      enableServiceLinks: false
{{- with $.Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: snmp-simulator
          image: "{{ $.Values.image.registry }}{{ $.Values.networkSimulator.image }}:{{ $.Values.networkSimulator.tag | default $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SNMP_SITE
              value: {{ $site | quote }}
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: SNMP_BASE_PORT
              value: {{ $.Values.networkSimulator.basePort | quote }}
            - name: SNMP_FAULTS_ENABLED
{{- if hasKey $.Values.networkSimulator "faultsEnabled" }}
              value: {{ $.Values.networkSimulator.faultsEnabled | quote }}
{{- else }}
              value: "true"
{{- end }}
            - name: SNMP_COMMUNITY
              valueFrom:
                secretKeyRef:
                  name: tinycars-network-snmp
                  key: community
          ports:
            - name: health
              containerPort: 8080
{{- range $index, $_ := $devices }}
            - name: snmp-{{ add $index 1 }}
              containerPort: {{ add $.Values.networkSimulator.basePort $index }}
              protocol: UDP
{{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
{{ toYaml $.Values.networkSimulator.resources | indent 12 }}
{{- range $index, $device := $devices }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $site }}-{{ $device }}
  labels:
    app.kubernetes.io/name: network-simulator
    app.kubernetes.io/part-of: tinycars
    tinycars.io/site: {{ $site }}
    tinycars.io/device: {{ $site }}-{{ $device }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: network-simulator
    tinycars.io/site: {{ $site }}
  ports:
    - name: snmp
      port: 161
      targetPort: {{ add $.Values.networkSimulator.basePort $index }}
      protocol: UDP
{{- end }}
{{- end }}
{{- if and .Values.networkSimulator.enabled .Values.networkSimulator.nodePortAccess.enabled }}
{{- $devices := list "router-01" "switch-01" "ap-01" "firewall-01" "server-01" "pos-01" "pos-02" "handheld-01" "handheld-02" }}
{{- range $siteIndex, $site := (.Values.networkSimulator.sites | default (list "boston" "chicago" "london")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: network-snmp-{{ $site }}
  labels:
    app.kubernetes.io/name: network-simulator
    app.kubernetes.io/part-of: tinycars
    tinycars.io/site: {{ $site }}
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: network-simulator
    tinycars.io/site: {{ $site }}
  ports:
{{- range $index, $device := $devices }}
    - name: snmp-{{ $device }}
      port: {{ add $.Values.networkSimulator.basePort $index }}
      targetPort: {{ add $.Values.networkSimulator.basePort $index }}
      nodePort: {{ add 31610 (mul $siteIndex 10) $index }}
      protocol: UDP
{{- end }}
{{- end }}
{{- end }}
{{- end }}
