{{- if .Values.networkSimulator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-simulator
  labels:
    app.kubernetes.io/name: network-simulator
    app.kubernetes.io/part-of: tinycars
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: network-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-simulator
        app.kubernetes.io/part-of: tinycars
      annotations:
        # The simulator is infrastructure test data, not an application workload.
        oneagent.dynatrace.com/inject: "false"
    spec:
      enableServiceLinks: false
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: snmp-simulator
          image: "{{ .Values.image.registry }}{{ .Values.networkSimulator.image }}:{{ .Values.networkSimulator.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SNMP_COMMUNITY
              valueFrom:
                secretKeyRef:
                  name: tinycars-network-snmp
                  key: community
          ports:
            - name: health
              containerPort: 8080
{{- range until 9 }}
            - name: snmp-{{ add . 1 }}
              containerPort: {{ add $.Values.networkSimulator.basePort . }}
              protocol: UDP
{{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
{{ toYaml .Values.networkSimulator.resources | indent 12 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: tinycars-network-snmp
  labels:
    app.kubernetes.io/part-of: tinycars
type: Opaque
stringData:
  community: {{ .Values.networkSimulator.community | quote }}
{{- $devices := list "boston-router-01" "boston-switch-01" "boston-ap-01" "chicago-router-01" "chicago-switch-01" "chicago-ap-01" "london-router-01" "london-switch-01" "london-ap-01" }}
{{- range $index, $device := $devices }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $device }}
  labels:
    app.kubernetes.io/name: network-simulator
    app.kubernetes.io/part-of: tinycars
    tinycars.io/device: {{ $device }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: network-simulator
  ports:
    - name: snmp
      port: 161
      targetPort: {{ add $.Values.networkSimulator.basePort $index }}
      protocol: UDP
{{- end }}
{{- end }}
