{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: tinycars
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: tinycars
{{- if $.Values.otel.instrumentation.enabled }}
      annotations:
        instrumentation.opentelemetry.io/inject-{{ $svc.inject }}: "true"
{{- end }}
    spec:
      enableServiceLinks: false
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}{{ $svc.image }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
{{- if $svc.port }}
          ports:
            - containerPort: {{ $svc.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
{{- end }}
          envFrom:
            - configMapRef:
                name: tinycars-config
            - secretRef:
                name: tinycars-secrets
          resources:
            requests:
              cpu: {{ $svc.cpuRequest }}
              memory: {{ $svc.memoryRequest }}
            limits:
{{- if $svc.cpuLimit }}
              cpu: {{ $svc.cpuLimit }}
{{- end }}
              memory: {{ $svc.memoryLimit }}
{{- if $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: tinycars
spec:
  type: {{ $svc.serviceType }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.servicePort }}
      targetPort: {{ $svc.port }}
{{- end }}
{{- end }}
{{- end }}
