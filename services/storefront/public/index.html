<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyCars - pocket-sized legends</title>
  <link rel="icon" href="/img/cars/TC-001.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <div class="bar">
      <div class="logo">
        <!-- The wrench is part of the logo: it is the hidden door to /admin. -->
        <svg viewBox="0 0 250 56" width="178" role="img" aria-label="TinyCars">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fb6e8"/><stop offset=".55" stop-color="#009FDC"/><stop offset="1" stop-color="#0a6f9c"/></linearGradient></defs>
          <a href="#/" aria-label="TinyCars home">
            <g transform="translate(2 14)">
              <path d="M2 30 L2 23 Q2 19 6 18.5 L13 17.5 L19 10 Q21 8 24 8 L35 8 Q38 8 40 10 L45 17.5 L50 18.5 Q53 19.5 53 24 L53 30 Z" fill="url(#lg)"/>
              <path d="M21 11 L28 11 L28 17.5 L16.5 17.5 Z M31 11 L36 11 L41.5 17.5 L31 17.5 Z" fill="#123A61" opacity=".85"/>
              <circle cx="14" cy="31" r="5.6" fill="#102033"/><circle cx="41" cy="31" r="5.6" fill="#102033"/>
              <circle cx="14" cy="31" r="2.4" fill="#c9ced5"/><circle cx="41" cy="31" r="2.4" fill="#c9ced5"/>
            </g>
            <text x="64" y="40" font-family="'PT Serif',Georgia,'Times New Roman',serif" font-weight="700" font-size="32" fill="#123A61">Tiny<tspan fill="#009FDC">Cars</tspan></text>
          </a>
          <a href="/admin" id="wrench" aria-label="Open the control room" style="cursor:pointer">
            <g transform="translate(222 4) scale(.95)" fill="none" stroke="#123A61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="wrench">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </g>
          </a>
        </svg>
      </div>
      <div class="catmenu">
        <button class="catbtn" id="catBtn" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Categories</button>
        <div class="mega" id="mega" hidden></div>
      </div>
      <form class="search" id="searchForm" role="search">
        <input id="q" type="search" placeholder="Search for cars, trucks, tanks and more" aria-label="Search" autocomplete="off">
        <button aria-label="Search"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M15.5 15.5 L21 21" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      </form>
      <button class="matchbtn" id="matchBtn" title="Describe yourself and we'll pick your car"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2l2.2 5.6L20 9l-4.6 3.8L17 19l-5-3.2L7 19l1.6-6.2L4 9l5.8-1.4z" fill="currentColor"/></svg>Find my car</button>
      <div class="tools">
        <select id="currency" aria-label="Currency"><option value="USD">$ USD</option><option value="GBP">&pound; GBP</option></select>
        <div class="acct" id="acct"><button class="signin" id="signInBtn">Sign in</button></div>
        <a class="cartbtn" href="#/cart" aria-label="Cart"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 4h2.2l2.3 10.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.5-1.2L21 8H6.3" fill="none" stroke="#2A2A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19.5" r="1.6" fill="#2A2A2A"/><circle cx="17" cy="19.5" r="1.6" fill="#2A2A2A"/></svg><span id="cartCount" class="count">0</span></a>
      </div>
    </div>
    <nav class="aisles" id="aisles" aria-label="Categories"></nav>
  </header>
  <main id="view"></main>
  <footer class="site">
    <div class="foot">
      <div><b>TinyCars</b><p>Pocket-sized legends, shipped from our warehouse or picked up in Boston, Chicago and London.</p></div>
      <div><b>Shop</b><a href="#/new">New arrivals</a><a href="#/cat/Limited%20Edition">Limited editions</a><a href="#/cart">Your cart</a></div>
      <div><b>Account</b><a href="#/account">Your orders</a><a href="#/account" id="footSignIn">Sign in</a></div>
    </div>
    <div class="fine">Demo storefront for observability testing. All cars, shoppers, orders and prices are made up.</div>
  </footer>
  <div id="toast" class="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script src="/app.js"></script>
</body>
</html>
