<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyCars - pocket-sized legends</title>
  <link rel="icon" href="/img/cars/TC-001.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="flagstrip"></div>
  <header class="top">
    <a class="logo" href="#/" aria-label="TinyCars home">
      <!-- The wrench is part of the logo: it is the hidden door to /admin. -->
      <svg viewBox="0 0 330 74" width="250" role="img" aria-label="TinyCars">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2554d"/><stop offset=".5" stop-color="#b3221c"/><stop offset="1" stop-color="#6e120e"/></linearGradient></defs>
        <g transform="translate(4 18)">
          <path d="M2 34 L2 26 Q2 22 7 21 L15 20 L22 12 Q24 10 27 10 L40 10 Q43 10 45 12 L51 20 L56 21 Q60 22 60 27 L60 34 Z" fill="url(#lg)"/>
          <path d="M24 13 L32 13 L32 20 L19 20 Z M35 13 L41 13 L47 20 L35 20 Z" fill="#2a3540"/>
          <circle cx="16" cy="35" r="6.5" fill="#111"/><circle cx="46" cy="35" r="6.5" fill="#111"/>
          <circle cx="16" cy="35" r="3" fill="#c9ced5"/><circle cx="46" cy="35" r="3" fill="#c9ced5"/>
        </g>
        <text x="74" y="50" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="700" font-size="40" letter-spacing="-1" fill="#f2f3f5">Tiny<tspan fill="#d9a520">Cars</tspan></text>
        <a href="/admin" id="wrench" aria-label="." style="cursor:pointer">
          <g transform="translate(300 2) scale(1.1)" fill="none" stroke="#f2f3f5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="wrench">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </g>
        </a>
      </svg>
    </a>
    <form class="search" id="searchForm"><input id="q" type="search" placeholder="Search cars, trucks, tanks..." aria-label="Search"><button>Go</button></form>
    <div class="tools">
      <select id="currency" aria-label="Currency"><option value="USD">$ USD</option><option value="GBP">&pound; GBP</option></select>
      <a class="cartbtn" href="#/cart">My Garage <span id="cartCount">0</span></a>
    </div>
  </header>
  <nav class="aisles" id="aisles"></nav>
  <main id="view"></main>
  <footer>TinyCars &middot; pocket-sized legends &middot; demo storefront, all cars and prices are made up.</footer>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
